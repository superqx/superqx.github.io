name: Prettier code formatter

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# Needed for creating branches/commits and opening PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Prefer npm ci when package-lock.json exists.
      # If you don't have a lockfile, switch to `npm install`.
      - name: Install dependencies 💾
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Run the check, but don't stop the workflow — we want to auto-fix + PR.
      - name: Prettier Check 🔎
        id: prettier
        continue-on-error: true
        run: npx prettier . --check

      # Only run fixes if Prettier check failed
      - name: Apply Prettier fixes ✨
        if: steps.prettier.outcome == 'failure'
        run: npx prettier . --write

      # OPTIONAL: keep your HTML diff artifact (handy for review)
      - name: Create diff 📝
        if: steps.prettier.outcome == 'failure'
        run: |
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt

      - name: Upload html diff ⬆️
        if: steps.prettier.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7

      # Create a PR with the formatting changes
      - name: Create pull request with formatting fixes
        if: steps.prettier.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: format with Prettier"
          title: "chore: format with Prettier"
          body: "This PR applies Prettier formatting fixes generated by CI."
          branch: "prettier-fixes-${{ github.run_id }}"
          delete-branch: true

      # If somehow still failing after write, fail the job
      - name: Verify Prettier after fixes ✅
        if: steps.prettier.outcome == 'failure'
        run: npx prettier . --check